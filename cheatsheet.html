<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>DX7 cheat sheet</title>
<!--
  A one-page DX7 reference, for printing.

  The algorithms are the app's own diagram component, not a redrawing of it:
  same routing flags the engine renders with, same code that draws them in the
  sidebar. It paints entirely through CSS variables, so turning the sheet black
  on white is a matter of redefining eight of them below rather than writing a
  second diagram that could drift from the first.

  Open it from the dev server and print to A4 portrait.
-->
<link rel="stylesheet" href="/src/ui/styles.css">
<style>
  /*
   * The app's colours on screen, black on white on paper.
   *
   * Everything here draws through the palette variables, the algorithm diagram
   * included, so the two versions of this page are one stylesheet and eight
   * redefinitions rather than two documents that could drift. On a screen it is
   * a page of the app and looks like one; in a print tray it is ink on paper
   * and a dark background would be forty grams of toner.
   */
  /*
   * One palette, two polarities. Not the app's.
   *
   * Inheriting the app's colours put blue carriers and amber feedback loops on
   * a sheet whose printed form is pure black and white, so the two versions
   * were different drawings rather than one drawing on two grounds. White on
   * near-black is what this is on a screen; black on white is what it is on
   * paper; nothing else is anything.
   */
  :root {
    --bg: #0b0d11; --surface: #0b0d11; --raise: #0b0d11; --raise-2: #fff;
    --text: #fff; --muted: #fff; --accent: #fff; --accent-2: #fff;
    --on-accent: #0b0d11; --hair: #fff;
  }
  @media print {
    :root {
      --bg: #fff; --surface: #fff; --raise: #fff; --raise-2: #000;
      --text: #000; --muted: #000; --accent: #000; --accent-2: #000;
      --on-accent: #fff; --hair: #000;
    }
  }
  @page { size: A4 portrait; margin: 9mm; }
  * { box-sizing: border-box; }
  /* The app's own typeface, not a manual's. This is a page about a program
     somebody made, printed from that program - setting it in Helvetica caps
     would be dressing it up as a photocopy of a Yamaha service sheet. */
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--ui);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  body { width: 192mm; margin: 0 auto; padding: 5mm 0; }
  @media print { body { width: auto; padding: 0; } }

  header { display: flex; align-items: center; gap: 4mm; margin-bottom: 5mm; }
  h1 { font-size: 6.4mm; margin: 0; font-weight: 700; }
  /* The app's own wordmark, in the app's own display face, with the two blocks
     it always wears. Bookends the title: what this is on the left, what drew
     it on the right. */
  /* The mark and the address are one link and look like neither: no colour,
     no underline. On paper the address is the only way back to the thing that
     drew the sheet, which is the whole reason it is printed at all; on screen
     it is the way there, so the two are the same target. Small rather than
     grey, because this sheet has no grey - see the palette above. */
  .brand-link { margin-left: auto; display: flex; flex-direction: column;
                align-items: flex-end; color: inherit; text-decoration: none; }
  .brand { display: flex; align-items: center; gap: 2mm; line-height: 1;
           font-family: 'Chango', var(--mono); font-size: 4.6mm; font-weight: 400; }
  /* Tucked right under the mark. The display face carries a deep line box, so
     even at zero margin there is air between them without this. */
  .brand-url { font-size: 2.5mm; line-height: 1; margin-top: 0.8mm; letter-spacing: 0.02em; }
  /* Under the sheet rather than in its header: the header is part of what
     gets printed, and a control living inside the thing it acts on has to be
     taken back out again on paper. On screen only, for the same reason. */
  .print-row { display: flex; justify-content: center; margin: 8mm 0 4mm; }
  .print {
    font: inherit; font-size: 3.4mm; cursor: pointer;
    padding: 2.2mm 7mm; border-radius: 1mm;
    background: var(--text); color: var(--bg); border: none;
  }
  @media print { .print-row { display: none; } }
  .brand::before, .brand::after {
    content: ''; height: 0.75em; width: 1.78em; background: var(--text); border-radius: 0.4mm;
  }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin-bottom: 7mm; }
  .tile { padding: 0; }
  .tile h2 { font-size: 3.4mm; margin: 0 0 2.5mm; font-weight: 700; }
  .fig { width: 100%; height: auto; display: block; }
  .fig .ln { fill: none; stroke: var(--text); stroke-width: 1; stroke-linejoin: round; }
  .fig .thin { stroke-width: 0.45; }
  .fig .dash { stroke-dasharray: 2 1.6; stroke-width: 0.4; }
  /* Held for as long as you hold the key, or for as long as the patch goes on
     sounding: a duration the picture cannot show, so it stops drawing it. */
  .fig .hold { stroke-dasharray: 0.1 2.4; stroke-linecap: round; }
  /* Four line styles for four curves. They all meet at the break point and all
     arrive at the same two corners, so shape alone cannot tell them apart. */
  .fig .lin-plus { }
  .fig .exp-plus { stroke-dasharray: 3.2 1.6; }
  .fig .exp-minus { stroke-dasharray: 0.1 2; stroke-linecap: round; stroke-width: 1.1; }
  .fig .lin-minus { stroke-dasharray: 4.5 1.4 0.1 1.4; stroke-linecap: round; }
  .fig text { font-family: inherit; font-size: 4px; fill: var(--text); }
  .fig .sm { font-size: 3.5px; }
  .fig .mid { text-anchor: middle; }
  .fig .end { text-anchor: end; }
  .fig .bold { font-weight: 700; }
  .fig .dot { fill: var(--text); }
  /* The octave scale: present, and quieter than the curves it measures. */
  .fig .grid { fill: none; stroke: var(--text); stroke-width: 0.25; opacity: 0.32; }

  h2.section { font-size: 3.4mm; margin: 0 0 5mm; font-weight: 700; }
  h2.section span { font-weight: 400; }

  /*
   * The carriers land on a common line across each row.
   *
   * Bottom-aligned rather than centred: every algorithm has its output row at
   * the foot of its own drawing, so aligning the feet puts all four carrier
   * rows of a row on one line and the page gets a horizontal rhythm instead of
   * thirty-two drawings floating at thirty-two heights.
   */
  .algos { display: grid; grid-template-columns: repeat(4, 1fr);
           gap: 4mm 2mm; align-items: end; }
  /*
   * The number beside the drawing rather than over it, and large enough to
   * find without reading. Grey, because it is an index: on a sheet you are
   * scanning for algorithm 22, the numbers want to be the thing you can see
   * from a foot away, and the diagrams want to be the thing you read once you
   * have stopped. Both at full black would compete.
   */
  /* Numbers in a column of their own, so they line up down the page, with the
     drawing centred in what is left - the widths run from one box to six, and
     left-aligning them left every column visibly ragged. */
  /* The number in a gutter of its own, so the numbers line up down the page
     however wide the drawing beside them turns out to be. */
  /*
   * The number sits on the carrier line, not in the middle of the drawing.
   *
   * Centred, it rode up and down with the height of the algorithm beside it -
   * a three-deep one pushed its number twelve pixels higher than the two-deep
   * one next to it, and a row of four read as four different heights even
   * though the drawings themselves were aligned to the pixel. The carriers are
   * the one line every algorithm has, so that is the line to hang everything
   * off. The padding is the drawing's own bottom margin, which is all that
   * sits between the carrier row and the foot of its box.
   */
  .cell { display: grid; grid-template-columns: 9mm 1fr; column-gap: 2mm;
          align-items: end; width: 100%; }
  .cell .n { font-size: 7mm; font-weight: 700; color: var(--text); opacity: 0.55;
             line-height: 0.82; text-align: right; padding-bottom: 0.8mm; }
  .cell svg { justify-self: start; }
  /* Sized in the script, from each drawing's own viewBox: see there. */
  .cell svg { display: block; }
  /*
   * 700, not the component's 600.
   *
   * Only 400 and 700 of Space Mono are loaded, so a request for 600 leaves the
   * browser free to synthesise one by smearing the regular - which at these
   * sizes comes out visibly wobbly, every digit leaning a slightly different
   * way. Asking for a weight that exists on disk gets the real glyphs.
   */
  .cell svg text { font-weight: 700; font-size: 26px; }
  /* Who modulates whom is the content of these pictures, and at print size the
     component's screen weight left the connections thinner than the box
     outlines they join. */
  .cell svg path[stroke="var(--muted)"] { stroke-width: 2.8; }
  /* The feedback loop is the one line that is not a connection between two
     operators - it is an operator wired to itself - so it is drawn as a
     different kind of line rather than the same line in a different place. */
  .cell svg path[stroke="var(--accent-2)"]:not([stroke-linejoin]) { stroke-dasharray: 7 5; }

</style>
</head><body>

<header>
  <h1>DX7 cheat sheet</h1>
  <a class="brand-link" href="https://groundstation1.github.io/dx7curation">
    <div class="brand"><span class="brand-name">DX7<span class="brand-sp"></span>curator</span></div>
    <div class="brand-url">groundstation1.github.io/dx7curation</div>
  </a>
</header>

<div class="tiles">
  <div class="tile">
    <h2>Operator envelope</h2>
    <svg class="fig" viewBox="0 0 100 52">
      <path class="ln thin" d="M14 44H97"/>
      <path class="ln" d="M16 38L31 10L49 22L67 26"/>
      <path class="ln hold" d="M67 26H75"/>
      <path class="ln" d="M75 26L89 38"/>
      <path class="ln hold" d="M89 38H97"/>
      <path class="ln dash" d="M16 44V6"/>
      <path class="ln dash" d="M75 44V6"/>
      <circle class="dot" cx="16" cy="38" r="1.1"/>
      <circle class="dot" cx="31" cy="10" r="1.1"/>
      <circle class="dot" cx="49" cy="22" r="1.1"/>
      <circle class="dot" cx="67" cy="26" r="1.1"/>
      <circle class="dot" cx="75" cy="26" r="1.1"/>
      <circle class="dot" cx="89" cy="38" r="1.1"/>
      <text class="mid bold" x="31" y="7.4">L1</text>
      <text class="mid bold" x="52" y="19.5">L2</text>
      <text class="mid bold" x="71" y="23">L3</text>
      <text class="mid bold" x="93" y="35">L4</text>
      <text class="mid" x="26" y="37">R1</text>
      <text class="mid" x="40" y="21">R2</text>
      <text class="mid" x="56" y="28">R3</text>
      <text class="mid" x="82" y="38.5">R4</text>
      <text class="sm mid" x="16" y="49">key on</text>
      <text class="sm mid" x="75" y="49">key off</text>
      <text class="sm end" x="12" y="11">loud</text>
      <text class="sm end" x="13.5" y="39.4">(L4)</text>
      <text class="sm end" x="12" y="44">off</text>
    </svg>
  </div>

  <div class="tile">
    <h2>Keyboard level scaling</h2>
    <div id="scaling"></div>
  </div>
</div>

<h2 class="section">The algorithms</h2>
<div class="algos" id="algos"></div>

<div class="print-row"><button class="print" onclick="window.print()">Print this sheet</button></div>



<script type="module">
  // The app's own diagram, so the sheet cannot disagree with what the engine
  // renders. Without a voice it draws plain numbered boxes, which is what a
  // general reference wants - the envelope glyphs are per-patch.
  const { algorithmDiagram } = await import('/src/ui/algorithmDiagram.ts');
  // Plotted from the engine, not drawn by hand: see scalingFigure.ts.
  const { scalingFigureSvg } = await import('/src/ui/scalingFigure.ts');
  document.getElementById('scaling').innerHTML = scalingFigureSvg();
  const host = document.getElementById('algos');
  /** Millimetres per viewBox unit. A box is 40 units, so it prints at 4.35mm. */
  const MM_PER_UNIT = 4.35 / 40;
  for (let alg = 0; alg < 32; alg++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const n = document.createElement('div');
    n.className = 'n';
    n.textContent = String(alg + 1);
    /*
     * A big box, then scaled down by CSS.
     *
     * The component's gaps are fixed pixels against a box that defaults to 26,
     * which is right on screen and far too airy at print density - eight rows
     * of it came to half a metre. Asking for a much larger box shrinks the
     * gaps relative to it, so the same drawing arrives dense; the printed size
     * is then set once, in millimetres, by the stylesheet.
     */
    const fig = algorithmDiagram(alg, { box: 40 });
    /*
     * One scale for all thirty-two, not one width.
     *
     * Setting a width in millimetres looks right until you notice that the
     * component's viewBox is only as wide as the algorithm needs - so
     * algorithm 1, which is two columns of four, got stretched to the same
     * width as the six-wide ones and came out nearly three inches tall.
     * Scaling from each drawing's own viewBox instead means an operator box is
     * the same size on every one of them, which is the whole point of putting
     * them on one sheet.
     */
    const [, , vw, vh] = fig.getAttribute('viewBox').split(/\s+/).map(Number);
    fig.setAttribute('width', `${(vw * MM_PER_UNIT).toFixed(2)}mm`);
    fig.setAttribute('height', `${(vh * MM_PER_UNIT).toFixed(2)}mm`);
    cell.append(n, fig);
    host.appendChild(cell);
  }
</script>
</body></html>
