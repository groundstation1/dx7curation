<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The wordmark's block, in the one place that can only take text.

      U+25A0 BLACK SQUARE, after trying either extreme. U+25AC BLACK RECTANGLE
      has the right proportion and sits low and thin in the line; two full
      blocks are the right weight and stand a full line tall. This one is
      centred on the text rather than sitting on the baseline, and is about
      three quarters of the em - which is the height the mark in the app is
      actually set to.

      It takes the tab's own text colour, so it works whether the browser draws
      tab text light on dark or dark on light, which a shaded character like
      U+2593 would not.
    -->
    <title>■ DX7 curator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
