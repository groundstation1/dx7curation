<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The wordmark's block, in the one place that can only take text.

      U+25AC BLACK RECTANGLE. Measured in the font a tab is drawn in (Segoe UI
      at 15px) it inks 9px tall against 11px for a black square and 19px for a
      full block, so it is the shortest of the three - but it is the only one
      whose proportion is actually the mark's, wider than it is tall, and in a
      tab at tab size that reads better than a squarer shape at the nominally
      correct height.

      It takes the tab's own text colour, so this works whether the browser
      draws tab text light on dark or dark on light - which a shaded character
      like U+2593 would not.
    -->
    <title>▬ DX7 curator ▬</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
