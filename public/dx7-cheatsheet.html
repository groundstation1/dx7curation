/*
 * The wordmark's own face: Chango, self-hosted.
 *
 * Self-hosted rather than linked, because the app promises that nothing leaves
 * this machine, and a stylesheet fetched from a font CDN on every load is a
 * request to somebody else's server announcing that you opened it. Twelve
 * kilobytes in the bundle is a fair price for that promise staying true
 * offline as well as on.
 */



/*
 * Space Mono for everything else.
 *
 * A monospace for body text is a deliberate choice here rather than a default:
 * this app is a wall of numbers - attack times, distances, scores, slot
 * numbers, ratings - read down columns far more often than along sentences,
 * and a fixed advance means those columns line up without being told to. It
 * also sits with Chango, which is the other half of the request: one loud
 * display face, one plain machine face, and nothing in between.
 */



:root {
  /*
   * Four tones and an accent. That is the whole visual system.
   *
   * The app is a dark field with a few thousand coloured dots on it, so the
   * chrome has to stay out of the way of the only colour that carries meaning.
   * Every surface is a flat step on one ramp, with a little warmth in it rather
   * than a neutral grey - a perfectly neutral background makes the dots look
   * like they are floating rather than sitting on something.
   *
   * There are no gradients, no bevels and no drop shadows on anything that sits
   * in the page. An earlier pass had all three: a hairline of light along the
   * top of every panel, a soft shadow under it, and a gradient in every button.
   * That reads as a stack of physical cards, which is a dated idea of depth.
   * Difference in tone and difference in space say the same thing without
   * pretending the screen has a light source.
   *
   * The one exception is something that genuinely floats over content - a
   * popover, a tooltip - which has to be told apart from what it covers.
   */
  --bg: #08090c;
  --surface: #181c24;
  --raise: #222732;
  --raise-2: #2e3440;
  /* The plot's own ground, shared with the canvas so the legend can fade into
     precisely this colour rather than one close to it. */
  --plot-bg: #101319;
  /*
   * The only line in the app, and it is a rule, never a box.
   *
   * Separating rows in a dense table is information. Drawing a rectangle around
   * a group of controls is decoration standing in for layout.
   */
  --hair: rgba(255, 255, 255, 0.055);
  --text: #e8eaf0;
  --muted: #868e9e;
  --accent: #6ea8fe;
  /* Text that sits on top of --accent. */
  --on-accent: #10131a;
  --accent-2: #ffca6a;
  --good: #7bd88f;
  --bad: #f2777a;
  --mono: 'Space Mono', ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  /* The same face for body text. See the @font-face note above. */
  --ui: 'Space Mono', ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
  --radius: 8px;
  --radius-sm: 6px;
  --pill: 999px;
  /* Overlays only. Nothing in the page flow uses this. */
  --float: 0 16px 40px rgba(0, 0, 0, 0.6);
  /* The gutter between cards. Black shows through it, which is what makes a
     card a card without drawing a line around one. */
  --gut: 10px;
  /*
   * How much room the sound dock takes along the bottom edge.
   *
   * Its controls are about 26px, so this leaves the same 8px above and below
   * them that the title bar leaves around the wordmark - the bottom edge of
   * the window gets the same margin as the top.
   */
  --dock-h: 42px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

/*
 * The hidden attribute beats any display this stylesheet sets.
 *
 * Without this, `display: flex` on a pane silently defeats `el.hidden = true` -
 * which is exactly what happened to the list: in map mode it was still there,
 * taking half the height, rendering rows nobody could see.
 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  /* Space Mono runs wide, so a notch down from 13 keeps the tables honest. */
  font: 12.5px/1.5 var(--ui);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(110, 168, 254, 0.3); }

/* Thin scrollbars, in the app's own colours rather than the platform's. */
* { scrollbar-width: thin; scrollbar-color: var(--raise-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--raise-2); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover { background: #3a4150; background-clip: content-box; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

#app {
  display: flex; flex-direction: column;
  height: 100%;
  /*
   * Room for the floating dock, and not a pixel more.
   *
   * The dock sits a gutter above the window edge, so this reserves its height
   * plus that gutter - which puts the bottom of the content area exactly on
   * the dock's top edge. The gutter *between* them is the view's own padding,
   * the same one it puts between its panes. Reserving two gutters here as well
   * is how that space came to be counted twice.
   */
  padding-bottom: calc(var(--dock-h) + var(--gut));
}

/* ---------------------------------------------------------------- chrome */

/*
 * Chrome, not a card: no surface under it, but held off the window edge by the
 * same gutter every pane uses.
 *
 * The frame of the app should read as the space the cards sit in rather than
 * as another card - giving it a surface made the wordmark and the tabs look
 * like one more pane of content. What it does need is the gutter: flush to the
 * window edge it was the one thing in the app not on the grid.
 */
header.topbar {
  display: flex;
  align-items: center;
  gap: 4px;
  margin: var(--gut) var(--gut) 0;
  border-radius: var(--radius);
  padding: 0 16px;
  /*
   * Sized so the space above the wordmark matches the space inside it.
   *
   * The blocks sit 10px from the name less a 0.13em pull, about 7px; at 54px
   * tall the bar left 16px above and below, which is more than twice that and
   * read as a band of empty with a small thing floating in it. 38 puts 8px
   * either side of the 22px name, so the whole mark has one rhythm.
   */
  height: 38px;
  background: none;
  flex: none;
  position: relative;
  z-index: 10;
}

/*
 * The wordmark, sized to the bar it sits in.
 *
 * It was 11.5px - the same size as the status counts beside it and smaller
 * than the tabs - so the app had no name, only a label. A wordmark that fills
 * its bar is the top of the reading order, and everything else can then be
 * small without the screen looking uniformly small.
 */
.topbar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  /* Chango is a single heavy weight with no lowercase to speak of, so it is
     set at its natural case and given room rather than tracked in tight. */
  font-family: 'Chango', var(--mono);
  font-size: 22px;
  font-weight: 400;
  letter-spacing: 0.01em;
  text-transform: none;
  margin-right: 24px;
  white-space: nowrap;
  color: var(--text);
  line-height: 1;
}
/*
 * A white block ahead of the name.
 *
 * Purely a mark. Sized in em so it is exactly as tall as the type beside it
 * and stays that way if the wordmark is ever resized, and 16:9 because a
 * rectangle reads as deliberate where a square reads as a missing icon. The
 * yellow dot it replaces looked like a status lamp, which is a promise the app
 * was not keeping.
 */
/* One either side, so the name is bracketed rather than just prefixed. */
.topbar .brand::before,
.topbar .brand::after {
  content: '';
  height: 0.75em;
  width: 1.78em;
  flex: none;
  border-radius: 2px;
  background: var(--text);
  margin-top: 0.1em;
}
.topbar .brand::before { margin-right: -0.13em; }
.topbar .brand::after { margin-left: -0.13em; }
/* Chango's word space is very wide, so the one inside the name is drawn
   rather than typed. */
.brand-name { white-space: nowrap; }
.brand-sp { display: inline-block; width: 0.14em; }

/*
 * Nudged down as a whole, rather than the text inside the buttons.
 *
 * The tabs have to line up with the blocks in the wordmark, which sit about a
 * pixel below the text beside them - but doing that with uneven padding moved
 * the word inside its own button, so the hover and active pill ended up with
 * more space above the word than below and looked like it was riding high.
 * Moving the whole row keeps each pill square around its own label.
 */
nav.tabs { display: flex; gap: 3px; flex: none; position: relative; top: 1px; }

/* A filled pill for the current tab: one shape and one fill, rather than an
   underline with a glow under it. */
nav.tabs button {
  white-space: nowrap;
  background: none;
  border: none;
  color: var(--muted);
  /* Even, so the pill sits square around the word. The row above carries the
     alignment against the wordmark. */
  padding: 6px 14px;
  border-radius: var(--pill);
  font: inherit;
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.12s, background 0.12s;
}
nav.tabs button:hover:not(:disabled) { color: var(--text); background: var(--surface); }
nav.tabs button.active { color: var(--text); background: var(--raise); }
nav.tabs button:disabled { opacity: 0.32; cursor: not-allowed; }

.topbar .spacer { flex: 1; }
.topbar .status {
  color: var(--muted); font-size: 11.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  margin-left: 16px;
}
.topbar .status b { color: var(--text); font-weight: 600; }

main.view { flex: 1; overflow: auto; padding: 24px 26px 36px; }
main.view.flush { padding: 0; overflow: hidden; }

/* ------------------------------------------------------------- task bar */

/* One bar for every slow thing, so a job with no progress is conspicuous
   rather than quietly absent. */
.taskbar {
  display: flex; align-items: center; gap: 10px;
  font-size: 11.5px; white-space: nowrap; min-width: 0;
}
.task-label { color: var(--text); }
.task-bar {
  position: relative; display: block; width: 140px; height: 3px; flex: none;
  border-radius: var(--pill); background: var(--raise-2); overflow: hidden;
}
.task-bar i {
  position: absolute; inset: 0 auto 0 0; display: block; width: 0;
  background: var(--accent); border-radius: var(--pill);
  transition: width 0.18s linear;
}
/* Work whose end cannot be known: a sweep rather than a lie about a fraction. */
.task-bar.indeterminate i { width: 38%; animation: task-sweep 1.15s ease-in-out infinite; }
@keyframes task-sweep {
  0% { transform: translateX(-105%); }
  100% { transform: translateX(275%); }
}
.task-detail { font-size: 11px; }
.task-stop {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 15px; line-height: 1; padding: 2px 6px; border-radius: var(--radius-sm);
}
.task-stop:hover { color: var(--bad); background: var(--raise); }

/* --------------------------------------------------- the advanced switch */

.adv-switch {
  display: flex; align-items: center; gap: 8px; flex: none;
  margin-left: 16px;
  color: var(--muted); font-size: 11.5px; cursor: pointer; user-select: none;
}
.adv-switch:hover { color: var(--text); }
.adv-switch input { position: absolute; opacity: 0; pointer-events: none; }
.adv-track {
  position: relative; width: 28px; height: 16px; border-radius: var(--pill); flex: none;
  background: var(--raise-2); transition: background 0.14s;
}
.adv-track::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--muted); transition: transform 0.14s, background 0.14s;
}
.adv-switch input:checked + .adv-track { background: var(--accent); }
.adv-switch input:checked + .adv-track::after { transform: translateX(12px); background: #08090c; }
.adv-switch input:focus-visible + .adv-track { outline: 2px solid var(--accent); outline-offset: 3px; }

/* ------------------------------------------------ progressive disclosure */

details.disc { margin: 0; }
details.disc > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted);
  transition: color 0.12s;
}
details.disc > summary::-webkit-details-marker { display: none; }
details.disc > summary::before {
  content: '';
  width: 0; height: 0; flex: none;
  border-left: 4px solid currentColor;
  border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent;
  transition: transform 0.14s;
}
details.disc[open] > summary::before { transform: rotate(90deg); }
details.disc > summary:hover { color: var(--text); }
.disc-note { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 11px; }
.disc-body { padding: 4px 0 12px; }

/* ---------------------------------------------------------------- basics */

/*
 * The one thing on the screen that is allowed to be large.
 *
 * Sized against the column it sits in rather than set to a fixed number, so it
 * fills the width it is given at any window size. Everything else in the app is
 * between 10 and 15 pixels, which is correct for dense controls and useless as
 * a reading order: with nothing large anywhere, the eye has nowhere to land
 * and the whole page arrives at once.
 */
/*
 * A column, not the whole window.
 *
 * Sources is a drop zone, a status line and a row of buttons. Stretched across
 * a wide monitor those become three lonely objects at opposite ends of a very
 * large empty rectangle, and the line lengths in between get unreadable.
 */
.page-narrow { max-width: 880px; margin: 0 auto; width: 100%; }

.page-head { margin: 0 0 8px; }
.page-title {
  font-size: clamp(30px, 5.2vw, 54px);
  line-height: 1.02;
  letter-spacing: -0.035em;
  font-weight: 600;
  margin: 0;
  color: var(--text);
}
.page-sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; max-width: 70ch; }

h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; letter-spacing: -0.01em; }
h3 {
  font-size: 10.5px; margin: 20px 0 8px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
p.hint { color: var(--muted); margin: 0 0 14px; max-width: 74ch; font-size: 12px; line-height: 1.55; }

button.btn {
  background: var(--raise);
  color: var(--text);
  border: none;
  border-radius: var(--radius-sm);
  padding: 7px 13px;
  font: inherit;
  font-size: 12.5px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
button.btn:hover:not(:disabled) { background: var(--raise-2); }
button.btn:active:not(:disabled) { background: #1b1f28; }
button.btn:disabled { opacity: 0.35; cursor: not-allowed; }
/* Solid accent, no gradient: one flat fill is louder than a shaded one. */
button.btn.primary { background: var(--accent); color: #0b1017; font-weight: 600; }
button.btn.primary:hover:not(:disabled) { background: #86b8ff; }
button.btn.danger { color: var(--bad); }
/* A toggle that is currently engaged. */
button.btn.on { color: var(--accent); background: rgba(110, 168, 254, 0.15); }
button.btn.off { color: var(--muted); }
/* The one button a screen is actually about. */
button.btn.big { padding: 10px 22px; font-size: 13.5px; border-radius: var(--radius); }

.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/*
 * A surface, not a card.
 *
 * One flat step up from the page and nothing else - no border, no shadow, no
 * highlight along the top. Every group in the app used to be a rounded
 * rectangle outlined in grey, six of them stacked down one screen, some nested
 * inside others. Tone and spacing separate things perfectly well.
 */
.panel {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 17px 19px;
}
/* A panel inside a panel is one surface too many: same material, one step up. */
.panel .panel { background: var(--raise); }
/* A quiet group - related controls that do not deserve their own surface. */
.sunk { background: rgba(0, 0, 0, 0.22); border-radius: var(--radius); padding: 13px 15px; }

label.field { display: flex; align-items: center; gap: 7px; color: var(--muted); }
label.field input[type="number"], label.field select, input.text, select {
  background: var(--raise);
  color: var(--text);
  border: none;
  border-radius: var(--radius-sm);
  padding: 6px 9px;
  font: inherit;
  font-size: 12.5px;
  transition: background 0.12s;
}
label.field input[type="number"]:hover, label.field select:hover, input.text:hover, select:hover {
  background: var(--raise-2);
}
label.field input[type="number"] { width: 66px; }
label.field input[type="checkbox"] { accent-color: var(--accent); }
input[type="range"] { accent-color: var(--accent); }
select.axis-select { max-width: 260px; }
select optgroup { color: var(--muted); font-style: normal; font-weight: 600; background: var(--surface); }
select option { color: var(--text); font-weight: 400; background: var(--surface); }

/* A segmented control: two or three exclusive choices, all of them visible. */
.seg { display: inline-flex; background: var(--bg); border-radius: var(--pill); padding: 3px; gap: 2px; }
.seg button {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: 12px; padding: 3px 12px; border-radius: var(--pill);
  transition: background 0.12s, color 0.12s;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--raise-2); color: var(--text); }

/* Rules between rows, never a box around the table. */
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--hair); }
table.data tr:last-child td { border-bottom: none; }
table.data th {
  color: var(--muted); font-weight: 600; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.07em;
}
table.data td.num, table.data th.num { text-align: right; font-family: var(--mono); }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover td { background: var(--raise); }
table.data tr.chosen td { background: rgba(110, 168, 254, 0.12); }

.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.warn { color: var(--accent-2); }
.bad { color: var(--bad); }
.good { color: var(--good); }

.stats { display: flex; gap: 28px; flex-wrap: wrap; }
.stat .k { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
.stat .v { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -0.015em; margin-top: 2px; }

progress {
  width: 320px; height: 3px; border: none; border-radius: var(--pill);
  background: var(--raise-2); overflow: hidden;
}
progress::-webkit-progress-bar { background: var(--raise-2); border-radius: var(--pill); }
progress::-webkit-progress-value { background: var(--accent); border-radius: var(--pill); }

kbd {
  font-family: var(--mono); font-size: 10.5px;
  background: var(--raise-2); border-radius: 4px; padding: 2px 6px; color: var(--text);
}

/* ------------------------------------------------------------ sound dock */

/*
 * Everything audible, along the bottom edge, above the piano roll it drives.
 *
 * Fixed rather than in the flow so no view has to leave room for it; `#app`
 * carries the padding instead.
 */
/* The same: chrome on the page, a gutter clear of the edge. */
.sound-dock {
  position: fixed; z-index: 45;
  left: var(--gut); right: var(--gut); bottom: var(--gut);
  background: none;
}
.sound-bar {
  display: flex; align-items: center; gap: 10px;
  /* Symmetric: a bottom-only pad pushed the row up and left the gap uneven. */
  height: var(--dock-h); padding: 0 14px;
  white-space: nowrap; overflow-x: auto; scrollbar-width: none;
}
.sound-bar::-webkit-scrollbar { height: 0; }
.sound-bar .field { gap: 6px; font-size: 11.5px; }
.sound-bar .btn { padding: 4px 10px; font-size: 11.5px; }
.sound-bar select { padding: 4px 8px; font-size: 11.5px; }
/* The strip's name, at the weight of a name. As muted 10px caps it read as the
   label of the control next to it rather than as the title of the row. */
.sound-title {
  font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
  color: var(--text); margin-right: 4px; flex: none;
}
/* Mute is an icon, so it gets an icon's frame: square, quiet, and unmistakably
   pressed when it is on. Red rather than green - it is the state that stops
   things working, and it has to be findable when you have forgotten about it. */
.sound-mute {
  background: none; border: none; cursor: pointer; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 24px; padding: 0; border-radius: var(--radius-sm); flex: none;
  transition: background 0.12s, color 0.12s;
}
.sound-mute:hover { color: var(--text); background: var(--raise); }
.sound-mute.on { color: var(--bad); background: rgba(242, 119, 122, 0.14); }
.sound-icon { display: inline-flex; }
.sound-vol:disabled { opacity: 0.35; cursor: not-allowed; }

/* A control that is off because something else is set, rather than because it
   is broken: dimmed, still readable, and carrying a title that says which
   setting took it away. */
.field.off { opacity: 0.45; }
select:disabled { cursor: not-allowed; }
/* Bigger than the text beside it: it is an icon standing in for a word, and at
   text size it reads as punctuation. */
.sound-more {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 18px; line-height: 1; padding: 3px 8px; border-radius: var(--radius-sm);
  flex: none; margin-left: 2px;
}
.sound-more:hover, .sound-more.on { color: var(--accent); background: var(--raise); }
.sound-vol { width: 96px; flex: none; }
.sound-sep { width: 1px; height: 16px; background: var(--hair); flex: none; margin: 0 4px; }
/* The typing keyboard's octave, readable at a glance while playing. */
.sound-oct {
  font-family: var(--mono); font-size: 11.5px; color: var(--accent);
  flex: none; min-width: 3ch; text-align: center;
}
.sound-midi {
  background: var(--raise); border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: var(--radius-sm);
  transition: background 0.12s, color 0.12s;
}
.sound-midi:hover { color: var(--text); background: var(--raise-2); }
.sound-midi.on { color: var(--good); background: rgba(123, 216, 143, 0.14); }
/* Opens upward, so reaching for the bend range never moves the app. This one
   does get a surface: it is a block of controls rather than a strip, and on
   bare black the rows would have nothing to sit on. */
.sound-panel {
  padding: 16px 16px 8px; margin-bottom: var(--gut);
  background: var(--surface); border-radius: var(--radius);
}
.sound-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; }

/* Every key the app answers to.
   Two fixed columns inside a readable measure: with `auto-fit` this spread
   across the whole window on a wide monitor, so eight short rows arrived as
   six columns of one-and-a-half rows each, every label wrapping. A reference
   table is read down a column, so the number of columns cannot depend on how
   wide the browser happens to be. */
.sound-shortcuts { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
.sound-shortcuts h3 {
  margin: 0 0 8px; font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); font-weight: 600;
}
.sc-list {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 32px; max-width: 620px;
}
.sc-row { display: flex; align-items: baseline; gap: 10px; font-size: 11.5px; }
.sc-keys { flex: none; width: 84px; }
.sc-what { color: var(--muted); }
.sc-note { margin: 12px 0 0; font-size: 11.5px; line-height: 1.6; color: var(--muted); max-width: 620px; }

/* The typing keyboard's legend: which letter is which note, and what is down.
   Two rows offset by half a key, so it reads as a keyboard at a glance. */
.keymap { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; }
.keyrow { display: flex; gap: 3px; }
/* Each row captioned where it is, rather than described in a table underneath.
   The caption sits at a fixed offset from the left so the three of them line
   up even though the rows themselves are staggered like a keyboard. */
.keyrow-wrap { display: grid; grid-template-columns: 264px auto; align-items: center; }
.keyrow-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
.keyrow-wrap:first-child .keyrow { margin-left: 13px; }
/* Offset the other way, so the three rows step like a keyboard. */
.keyrow-wrap:last-child .keyrow { margin-left: -7px; }
.keycap.gap { background: none; }
.keycap {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 22px; height: 24px; padding: 0 5px; border-radius: var(--radius-sm);
  background: var(--raise-2); color: var(--text);
  font-family: var(--mono); font-size: 11px; text-transform: uppercase;
}
/* Black keys sit lower and darker, so the row reads as a keyboard rather than
   as seventeen identical buttons. */
.keycap.sharp { background: var(--bg); color: var(--muted); }
/* The soft row: the same notes, lighter on the page as they are on the ear. */
.keycap.soft { background: var(--surface); color: var(--muted); }
.keycap.down { background: var(--accent); color: #0b1017; }

/*
 * The MIDI-in strip: along the bottom edge, above the dock, never in the way.
 *
 * Masked so it dissolves upward rather than ending on a line, which is what
 * keeps it out of the way of whatever it is sitting on top of.
 */
.piano-roll {
  /*
   * Hard against the bottom of the window, and over everything.
   *
   * It used to sit above the sound dock, which put it inside the card grid and
   * made it look like part of whichever pane happened to be behind it. It is
   * not part of a pane: it is what the keyboard is doing, and that belongs to
   * the window rather than to the view. Over the dock as well, since it passes
   * no clicks - the controls underneath stay reachable, and the canvas is
   * transparent everywhere a note is not being drawn.
   *
   * Below the operator tooltip on purpose: that is a card you are reading, and
   * nothing should paint across it.
   */
  position: fixed; left: 0; right: 0; bottom: 0; height: 320px;
  width: 100%; pointer-events: none; z-index: 55;
  opacity: 0; transition: opacity 0.5s ease-out;
  /*
   * The solid part stays where it was - 20% of 320 is the same 64px as 35% of
   * 184 - and everything above it fades far more slowly, so the faintest end
   * of a phrase is still there near the top of the strip instead of having
   * been cut off a third of the way up.
   */
  -webkit-mask-image: linear-gradient(to top, #000 0%, #000 20%, rgba(0, 0, 0, 0.55) 45%, rgba(0, 0, 0, 0.22) 70%, transparent 100%);
  mask-image: linear-gradient(to top, #000 0%, #000 20%, rgba(0, 0, 0, 0.55) 45%, rgba(0, 0, 0, 0.22) 70%, transparent 100%);
}

/* ------------------------------------------------------------ drop zone */

/* A tinted area, not a dashed rectangle. The whole thing is the target, so the
   fill is the affordance and an outline adds nothing to it. */
.dropzone {
  background: var(--raise);
  border-radius: var(--radius);
  padding: 34px;
  text-align: center;
  color: var(--muted);
  transition: background 0.12s, color 0.12s;
}
.dropzone.over { background: rgba(110, 168, 254, 0.16); color: var(--text); }

/* The first screen, when there is nothing yet: the drop zone is the page. */
.onboard { max-width: 640px; margin: 8vh auto 0; text-align: center; }
.onboard h1 { font-size: clamp(28px, 4.4vw, 44px); font-weight: 600; margin: 0 0 10px; letter-spacing: -0.03em; line-height: 1.05; }
.onboard .lede { color: var(--muted); margin: 0 0 26px; font-size: 13.5px; }
.onboard .dropzone { padding: 52px 30px; }
.onboard .drop-big { font-size: 16px; color: var(--text); margin-bottom: 10px; }
.onboard a { color: var(--accent); }
.onboard .panel { margin-top: 8px; text-align: left; }

/* ----------------------------------------------------------------- map */

/*
 * Cards on black, with the gutters showing through.
 *
 * The full-bleed panes this replaced were separated by hairlines, which meant
 * the plot, the table and the sidebar read as one undivided surface with lines
 * drawn on it. Rounded surfaces with black between them say where one thing
 * ends and the next begins without drawing anything at all.
 */
.map-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w, 380px);
  gap: var(--gut); padding: var(--gut);
  height: 100%; position: relative; background: var(--bg);
}
/* min-height: 0 because a grid item defaults to min-height: auto, which means
   "never shrink below your content". With a canvas that was harmless; with a
   list whose content is forty thousand rows tall it made the column grow to
   forty thousand rows tall, and the virtual scroller - which renders what fits
   in its own height - dutifully rendered all of them. */
.map-main {
  position: relative; display: flex; flex-direction: column; gap: var(--gut);
  min-width: 0; min-height: 0;
}
.map-controls {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 9px 14px; background: var(--surface); border-radius: var(--radius);
  flex: none; position: relative; z-index: 5;
}
/* The plot and the legend that explains it, as one card. */
.map-plot {
  position: relative;
  display: flex; flex-direction: column; min-height: 0; flex: 1;
  background: var(--plot-bg); border-radius: var(--radius); overflow: hidden;
}
/*
 * The legend floats over the foot of the plot and dissolves upward into it.
 *
 * As a strip below the canvas it ended on a hard horizontal edge across the
 * full width, which cut the plot off rather than finishing it - and it cost
 * the plot forty pixels of height on a screen where the plot is the point.
 */
.map-plot .legend {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 26px 14px 10px;
  background: linear-gradient(to top, var(--plot-bg) 0%, var(--plot-bg) 55%, transparent 100%);
}
.map-canvas-wrap { position: relative; flex: 1; min-height: 0; }

/*
 * The control bar reads as groups, not as eight widgets in a row.
 *
 * A small caps label in front of each group, a rule between groups, and the
 * controls themselves left at full size. Everything in this bar used to be the
 * same size and weight in the same colour, which meant finding the one you
 * wanted required reading all of them.
 */
.ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ctl-label {
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); flex: none;
}
.bar-sep { width: 1px; align-self: stretch; margin: 2px 4px; background: var(--hair); flex: none; }
.map-canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.map-side { background: var(--surface); border-radius: var(--radius); overflow: auto; padding: 16px; }

/* Floating over the plot rather than spending a control-bar slot on it. */
.map-reset {
  position: absolute; top: 12px; right: 12px; z-index: 4;
  background: var(--raise); color: var(--muted); border: none;
  border-radius: var(--radius-sm); padding: 5px 11px; font: inherit; font-size: 11.5px;
  cursor: pointer;
}
.map-reset:hover { color: var(--text); background: var(--raise-2); }

/* The divider between plot and table in split mode. */
/*
 * The divider between the plot and the table.
 *
 * The whole gutter is the target, not the line drawn in it. The negative
 * margins cancel the flex gaps on either side, so it occupies exactly the
 * gutter it sits in rather than adding a third one - and a ten pixel grab
 * area is the difference between a handle and a dare.
 */
.pane-split {
  height: var(--gut); margin: calc(-1 * var(--gut)) 0; flex: none;
  cursor: row-resize; position: relative; background: none; z-index: 6;
  touch-action: none;
}
.pane-split::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 40px; height: 3px; margin: -1.5px 0 0 -20px; border-radius: var(--pill);
  background: var(--raise-2);
  transition: background 0.12s;
}
.pane-split:hover::after, .pane-split.dragging::after { background: var(--accent); }

/* -------------------------------------------------------------- search */

.search-wrap { position: relative; }
.search-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--raise); border: none; color: var(--muted); cursor: pointer;
  font: inherit; font-size: 12px; padding: 6px 11px; border-radius: var(--radius-sm);
  transition: background 0.12s, color 0.12s;
}
.search-btn:hover { color: var(--text); background: var(--raise-2); }
/* A search that is filtering must never be invisible: the chip is the reminder. */
.search-btn.on { color: var(--accent); background: rgba(110, 168, 254, 0.15); }
.search-btn .ico { width: 13px; height: 13px; flex: none; }
.search-btn .q { font-family: var(--mono); font-size: 11.5px; color: var(--text); max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-btn .x { opacity: 0.6; }
/* An overlay, so it gets one of the two shadows in the app: it has to be told
   apart from whatever it is covering. */
.search-pop {
  position: absolute; top: calc(100% + 8px); left: 0; z-index: 30;
  width: 380px; padding: 14px; border-radius: var(--radius);
  background: var(--raise); box-shadow: var(--float);
  display: flex; flex-direction: column; gap: 10px;
}
.search-pop input.text { width: 100%; font-size: 13px; padding: 8px 10px; background: var(--bg); }
.search-pop select { background: var(--raise-2); }
.search-pop .row { gap: 8px; font-size: 11.5px; }
/* A line of explanation under a control or a table. */
.note { color: var(--muted); font-size: 11px; line-height: 1.5; }

/* ---------------------------------------------------------------- list */

.list-pane {
  flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column;
  background: var(--surface); border-radius: var(--radius); overflow: hidden;
}
/* Clipped, and scrolled sideways by the rows, so wide columns cannot spill
   out over the sidebar sitting in the next grid column. */
.list-head { overflow: hidden; background: var(--surface); flex: none; box-shadow: 0 1px 0 var(--hair); }
.list-head-grid { display: grid; gap: 10px; padding: 0 14px; min-width: 620px; }
.list-th {
  background: none; border: none; padding: 8px 0; text-align: left;
  font: inherit; font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; white-space: nowrap;
}
.list-th.num { text-align: right; }
.list-th:hover:not(:disabled) { color: var(--text); }
.list-th.on { color: var(--accent); }
.list-arrow { font-size: 9px; }

/* The scroller holds a spacer the full height of the set; the rows are a
   window translated into place, so thirty thousand voices cost forty rows. */
.list-scroll { flex: 1; min-height: 0; overflow: auto; position: relative; }
.list-spacer { width: 1px; }
.list-rows { position: absolute; top: 0; left: 0; right: 0; min-width: 620px; will-change: transform; }
.list-row {
  display: grid; gap: 10px; padding: 0 14px; height: 27px; align-items: center;
  cursor: pointer; font-size: 12px;
}
.list-row:hover { background: var(--raise); }
.list-row.on { background: rgba(110, 168, 254, 0.14); }
/* Clicked, and therefore pinned: the sidebar stays on this one until you click
   it again or press escape. Marked with a bar rather than more colour, so it
   is still obvious while the cursor is somewhere else entirely. */
.list-row.held { background: rgba(110, 168, 254, 0.2); box-shadow: inset 3px 0 0 var(--accent); }
/* A search miss, when the search is highlighting rather than filtering. */
.list-row.dim { opacity: 0.32; }
.list-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-cell.num { text-align: right; font-variant-numeric: tabular-nums; }
.list-name { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11.5px; }
.list-name i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.list-from { color: var(--muted); font-size: 11px; }
.rating-on { color: var(--accent-2); letter-spacing: -1px; }
.rating-guess { color: var(--accent-2); letter-spacing: -1px; opacity: 0.65; }
.list-count { padding: 7px 14px; font-size: 11px; flex: none; box-shadow: 0 -1px 0 var(--hair); }

.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/*
 * The one part of the sidebar you act on, marked as such.
 *
 * A tinted block a step up from the panel around it, so the controls read as
 * controls rather than as two more rows of the detail list above them.
 */
.voice-actions {
  background: var(--raise); border-radius: var(--radius);
  padding: 10px 12px; margin: 12px 0 4px;
}
/* Centred, with the pin hugging the stars rather than exiled to the far edge:
   they are one decision about one patch, not two unrelated controls. */
.act-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.act-btn {
  background: var(--raise-2); border: none; color: var(--text); cursor: pointer;
  font: inherit; font-size: 12px; padding: 6px 12px; border-radius: var(--radius-sm);
  transition: background 0.12s, color 0.12s;
}
.act-btn:hover { background: #3a4150; }
.act-btn.on { background: rgba(110, 168, 254, 0.2); color: var(--accent); }

/* A drawn pin, which fills in when it is stuck in. */
.act-pin {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; flex: none;
  background: var(--raise-2); border: none; border-radius: var(--radius-sm);
  color: var(--muted); cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.act-pin .ico { width: 17px; height: 17px; }
.act-pin:hover { background: #3a4150; color: var(--text); }
.act-pin.on { background: rgba(255, 202, 106, 0.18); color: var(--accent-2); }

/* The rating, in the same notation it is drawn in everywhere else - and at a
   size you can actually hit, since this is the control, not a readout. */
.stars { display: flex; gap: 2px; }
.star {
  background: none; border: none; cursor: pointer; padding: 2px 2px;
  font-size: 27px; line-height: 1; color: var(--raise-2);
  transition: color 0.1s, transform 0.1s;
}
.star.on { color: var(--accent-2); }
/* Hovering a star lights it and everything before it, so the rating you are
   about to give is visible before you give it. */
.stars:hover .star { color: var(--accent-2); }
.stars .star:hover ~ .star { color: var(--raise-2); }
.star:hover { transform: translateY(-1px); }

.act-keys {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  margin-top: 10px; font-size: 10.5px;
}
.act-keys kbd { font-size: 9.5px; padding: 1px 4px; }

/* The patch heading, with its download tucked into the top right corner. */
.voice-head { display: flex; align-items: flex-start; gap: 10px; }
.voice-name { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Labelled, not a lone arrow: an icon by itself in a corner is a guess. */
/* There are two of these now, and `margin-left: auto` on both split the free
   space between them - so the first sat marooned in the middle of the header.
   Only the first takes the space; the pair then hugs the right edge together,
   spaced by the header's own gap. */
.voice-dl + .voice-dl { margin-left: 0; }
.voice-dl {
  margin-left: auto; flex: none;
  padding: 5px 9px; border: none; border-radius: var(--radius-sm);
  background: var(--raise); color: var(--text); cursor: pointer;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.2;
  white-space: nowrap;
  transition: background 0.12s;
}
.voice-dl:hover { background: var(--raise-2); }

.detail dt { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 12px; }
.detail dd { margin: 2px 0 0; font-variant-numeric: tabular-nums; }

/*
 * The measurements, two to a row.
 *
 * Each cell carries a label, a number and a bar showing where that number
 * falls in the range the corpus occupies - which is the part that turns a
 * reading into a judgement.
 */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 14px; }
.stat-cell { min-width: 0; }
.stat-cell.wide { grid-column: 1 / -1; }
.stat-cell.wide select { width: 100%; margin-top: 3px; }
/* Allowed two lines rather than an ellipsis: "predicted rat..." is not a
   label. Space Mono is a wide face and these cells are half a sidebar. */
.stat-k {
  color: var(--muted); font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; line-height: 1.25;
  min-height: 2.5em;
}
.stat-v {
  margin-top: 2px; font-variant-numeric: tabular-nums; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stat-bar {
  position: relative; height: 3px; margin-top: 5px;
  border-radius: var(--pill); background: var(--raise-2); overflow: hidden;
}
.stat-bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: var(--pill); }

/* A narrow sidebar cannot take two columns without the labels shredding. */
@media (max-width: 340px) {
  .stat-grid { grid-template-columns: 1fr; }
}

/* A main column with the voice detail panel beside it, as the map has.
 *
 * Capped, and the cap includes the sidebar. The column was `1fr` on an
 * uncapped page, so on a wide monitor the content sat at its own readable
 * width on the left and the sidebar was pinned to the far right edge with a
 * third of the screen of nothing between them - and anything right-aligned
 * inside the content, like the rebuild button, ended up a foot from the
 * sentence it belonged to. Widening the sidebar widens the whole layout, so
 * dragging it still does what it looks like it does. */
.detail-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w, 380px);
  gap: 24px; align-items: start; position: relative;
  max-width: calc(880px + 24px + var(--side-w, 380px)); margin: 0 auto;
}
/* Exactly as tall as the space it is in, less this view's own padding. The
   viewport-based guess it replaces was fifty pixels out, which is why these
   pages all had a little scroll in them that nothing on the page accounted
   for. The fallback is only used before the first measurement lands. */
.detail-side {
  position: sticky; top: 0; overflow: auto;
  max-height: calc(var(--view-h, 70vh) - 60px);
  background: var(--surface); border-radius: var(--radius); padding: 16px;
}
.detail-side .voice-panel > h3 { font-size: 10.5px; margin: 18px 0 4px; }
.ab .voice-panel { margin-top: 12px; }
.ab .voice-panel .detail dd { font-size: 12px; }

/* --------------------------------------------------------------- rating */

/* Anything the app is blocking on, in the middle of the screen it is blocking.
   The same block on all three of them, so one kind of waiting looks like one
   kind of waiting.

   A single max-content column, so the bar comes out exactly as wide as the
   wordmark sitting above it. Centred in a flex column it shrank to its own
   text - a 200px bar under a 600px mark, which reads as an afterthought - and
   any fixed width would have to be kept in step with a clamp() on the type.
   This balances by construction, at every window size. The minimum is for the
   screens that show no mark, where the column would otherwise be as wide as
   the word "Preparing". */
.centre-load {
  display: grid;
  /* The floor belongs on the track, not on the bar. As a `min-width` on the
     bar the `100%` had nothing definite to resolve against - the column width
     was still being worked out from its contents - so it collapsed to nothing
     and the screens with no wordmark got a bar as wide as the word on it. */
  grid-template-columns: minmax(min(480px, 100%), max-content);
  justify-content: center; align-content: center;
  gap: 22px; min-height: 52vh; max-width: 100%;
}
/* A little narrower than the mark above it, rather than exactly as wide.
   Matching it to the pixel reads as a coincidence being enforced; three
   quarters of it reads as a bar belonging to a title. The percentage resolves
   against the track, which the wordmark has already sized, so the proportion
   holds at every window width without a second number to keep in step. */
.centre-load .splash-load {
  width: 76%; max-width: none; margin: 0; justify-self: center;
}
.boot-load { min-height: 62vh; }

.rate-wrap { max-width: 780px; margin: 0 auto; }
.rate-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 30px; text-align: center;
}
.rate-name { font-size: 30px; font-weight: 600; letter-spacing: 0.01em; font-family: var(--mono); }
.rate-meta { color: var(--muted); margin-top: 8px; }
/* The rating control on its own screen: the same stars as the sidebar, at the
   size a screen with one patch on it can afford, with the undo beside them. */
.rate-stars { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 22px; }
.stars.big .star { font-size: 40px; padding: 2px 4px; }
.rate-stars .btn { padding: 6px 12px; }

.rate-keys { display: flex; gap: 8px; justify-content: center; margin-top: 24px; }
.rate-keys button {
  width: 54px; height: 54px; border-radius: var(--radius); font-size: 19px; font-weight: 600;
  background: var(--raise); color: var(--text); border: none; cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.rate-keys button:hover { background: var(--raise-2); }
.rate-keys button.on { background: var(--accent); color: #0b1017; }
.rate-keys.map-rate { margin-top: 12px; gap: 6px; }
.rate-keys.map-rate button { width: 40px; height: 34px; font-size: 15px; border-radius: var(--radius-sm); }

.keyhelp { display: flex; gap: 20px; justify-content: center; color: var(--muted); margin-top: 20px; flex-wrap: wrap; }

.ab { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.ab .side { border-radius: var(--radius); padding: 20px; background: var(--surface); }
/* Which side is sounding, said with fill rather than with a ring around it. */
.ab .side.live { background: rgba(110, 168, 254, 0.16); }
.ab .side .tag { color: var(--muted); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.ab .side .nm { font-family: var(--mono); font-size: 18px; margin-top: 6px; }

/* ------------------------------------------------------------- ranking */

/* The band as it stands. Dense, because the point is to read down it. */
.rank-list { list-style: none; margin: 0; padding: 0; counter-reset: rank; }
.rank-list li {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 8px; border-radius: var(--radius-sm); cursor: pointer;
  font-size: 12px; counter-increment: rank;
}
.rank-list li::before {
  content: counter(rank);
  min-width: 22px; text-align: right; color: var(--muted);
  font-family: var(--mono); font-size: 11px; flex: none;
}
.rank-list li:hover { background: var(--raise); }
.rank-list li.on { background: rgba(110, 168, 254, 0.16); }
.rank-nm { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-sc { margin-left: auto; font-family: var(--mono); font-size: 11px; flex: none; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }

.ab .side { cursor: pointer; }
.ab .side .dot { margin-right: 5px; vertical-align: middle; }

/* --------------------------------------------------------------- build */

.bank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.bank { background: var(--raise); border-radius: var(--radius); padding: 12px 14px; }
.bank h4 { margin: 0 0 10px; font-size: 10px; color: var(--muted); letter-spacing: 0.09em; text-transform: uppercase; }
.bank ol { margin: 0; padding-left: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; }
.bank li::marker { color: var(--muted); }
/*
 * A patch name is sixteen characters and never wraps; a wrapped slot list
 * loses the one thing it is for, which is reading down the numbers.
 *
 * The marker has to be inside the content box for that: an outside marker sits
 * in the padding, where `overflow: hidden` clips it away entirely - which is
 * how the slot numbers vanished the first time this was tried.
 */
.bank li {
  list-style-position: inside;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slot-cat { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 7px; vertical-align: middle; }
/* Pinned, in the same colour the table marks it. */
.slot-pin { color: var(--accent-2); }
/* A slot the cursor is on, and one clicked to keep. */
.bank li.slot { cursor: pointer; border-radius: 4px; padding: 0 5px; margin-left: -5px; }
.bank li.slot:hover { background: var(--raise-2); }
.bank li.slot.on { background: rgba(110, 168, 254, 0.16); color: var(--text); }
.bank li.slot.held { background: rgba(110, 168, 254, 0.26); color: var(--text); }

/* The build's own header: current, or out of date and why.
   No coloured bar down the edge. The state is already said in words, twice, in
   the two lines of this panel - a stripe beside them is a third rendering of
   the same fact in the one register that cannot say which fact it is. A stale
   build gets a warm tint across the whole panel instead, which reads as a
   condition of the thing rather than as a decoration attached to it. */
.build-state.stale {
  background: linear-gradient(var(--raise), var(--raise));
  border: 1px solid rgba(255, 202, 106, 0.28);
}

/* Every MIDI output at once. Sending to the wrong one is silent, so the choice
   cannot be hidden inside a control that shows one name at a time. */
.port-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.port {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px; border-radius: var(--radius-sm);
  background: var(--raise); color: var(--muted); font-size: 11.5px; cursor: pointer;
}
.port:hover { color: var(--text); }
.port.on { color: var(--text); background: var(--raise-2); }
.port input { accent-color: var(--accent); margin: 0; }

/* The single button the Build page is about, and what it is about to do. */
.build-hero { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
/* The counts as figures rather than as a sentence: four numbers read as four
   numbers, and the two that mean something went short are the two that carry a
   colour. */
.build-figs { display: flex; gap: 26px; flex-wrap: wrap; }
.build-fig .v { font-size: 19px; font-weight: 600; color: var(--text); line-height: 1.2; }
.build-fig .v.warn { color: var(--accent-2); }
.build-fig .v.bad { color: var(--bad); }
.build-fig .k { font-size: 11px; color: var(--muted); margin-top: 1px; }

/*
 * The sidebar's draggable edge. Positioned against the layout rather than
 * inserted into the grid, so the columns stay two and a scrolling sidebar
 * cannot carry it off.
 */
/*
 * The handle sits in the gutter between the plot and the sidebar.
 *
 * The offset has to count the layout's own right padding as well as the
 * sidebar and half the gap, because an absolutely positioned child is placed
 * against the padding box - which includes that padding - rather than against
 * the content box the grid columns live in. Leaving it out put the handle a
 * full gutter to the right, on top of the sidebar's edge instead of in the
 * gap: measured at 551 where the gutter's centre was 541.
 */
.side-handle {
  position: absolute; top: 0; bottom: 0;
  right: calc(var(--side-w, 380px) + var(--gut) * 1.5);
  width: 16px; margin-right: -8px; z-index: 6;
  cursor: col-resize; touch-action: none;
}
/* The same grabber as the horizontal one, turned on its side. */
.side-handle::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  width: 3px; height: 40px; margin: -20px 0 0 -1.5px; border-radius: var(--pill);
  background: var(--raise-2); transition: background 0.12s;
}
.side-handle:hover::after, .side-handle.dragging::after { background: var(--accent); }
/* That layout has a 24px gap and no padding of its own, so half the gap is
   the whole correction. */
.detail-layout .side-handle { right: calc(var(--side-w, 380px) + 12px); }

/*
 * A source entry: name and slots on one line, the path under it.
 *
 * The path truncates in the middle - the directory half gets the ellipsis and
 * the filename is always whole - which is done by letting one span shrink
 * beside one that cannot. No measuring, so it re-truncates for free when the
 * sidebar is dragged.

/* No bullets and no indent: this list is dense on purpose. */
.src-list { list-style: none; margin: 0; padding: 0; font-size: 11px; line-height: 1.4; }

/*

.vl-rating.on { color: var(--accent-2); }

/* Both thresholds are cut-offs: the shading runs from the top of the table
   down to the chosen row, so "this and everything closer" is visible rather
   than something the user has to infer from two numbers. */
table.sweep td, table.sweep th { padding-top: 7px; padding-bottom: 7px; }
table.sweep .zone-cell { width: 150px; padding-right: 8px; position: relative; white-space: nowrap; }

   Fixed layout because the first column holds paths a hundred characters long

/* ------------------------------------------------- the described pulldown */

/*

.rsel { position: relative; display: inline-flex; }
.rsel-btn {
  display: inline-flex; align-items: center; gap: 8px;

  padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
.rsel-btn:hover, .rsel.open .rsel-btn { background: var(--raise-2); }

.rsel-caret {
  width: 0; height: 0; flex: none; margin-left: 2px;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--muted);
}

.rsel-row.hot { background: var(--raise-2); }

.rsel-note { font-size: 11px; color: var(--muted); line-height: 1.45; margin-top: 2px; }

/* ---------------------------------------------------------------- about */

/* A quiet link in the chrome: findable, and not competing with the tabs. */

.about h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
.about .lede { color: var(--muted); margin: 0 0 4px; font-size: 13px; max-width: 62ch; line-height: 1.6; }
.about .panel h2 { margin: 0 0 2px; font-size: 15px; }
.about .panel > .note { margin: 0 0 14px; }
/* Each credit is a block, not a table row: the licence and the person are
   asides to the name, and the sentence under them is the actual content. */
.credit + .credit { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hair); }
.credit-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }

.credit-head a { color: var(--accent); }

   one thing you came here to press on the right. */
.sheet-link { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.sheet-link h2 { margin-top: 0; }
.sheet-link .note { margin-bottom: 0; }
.sheet-link .btn { margin-left: auto; flex: none; text-decoration: none; }

 * The first screen while something is loading into it.
 *
 * One bar, the size of the decision it replaced. Every stage - fetching,
 * unpacking, writing, reading back, analysing - reports through it rather than

.splash-load { max-width: 520px; margin: 40px auto 0; }
.splash-load-label { font-size: 14px; margin-bottom: 12px; }

}

  border-radius: var(--pill); transition: width 0.2s linear;
}

}

   are handing over, not about a collection that ships with the app. */

.bare { padding: 0; }

.pipeline-state {

  padding-bottom: 14px; margin-bottom: 2px;
}
.splash-restore { margin-top: 14px; display: flex; justify-content: center; }

.link-keep { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }

   screen it is the only thing there is to look at. The card is already a
   surface, so the panel does not need one of its own. */
.link-diagram { margin: 14px 0 2px; }
.link-diagram .algo-diagram { background: none; padding: 0; }
.btn.wide { width: 100%; justify-content: center; text-align: center; }

.drop-inner { text-align: left; }
.drop-inner .field { justify-content: flex-start !important; margin-top: 10px !important; font-size: 11px; }

.drop-armed .splash-card.dropzone { background: var(--raise); box-shadow: inset 0 0 0 1px var(--accent); }

 * The first screen sits on a scrim, over whatever the app would otherwise be

 * the same idea: one thing to attend to, and the rest dimmed out of the way.

.splash-scrim {
  position: fixed; inset: 0; z-index: 50;
  /* Light enough to read the app through: it is dimmed, not hidden, because

  background: rgba(8, 9, 12, 0.58);
  backdrop-filter: blur(2px);
  overflow: auto;
  /*

   * the middle of a screen to be above its middle; a third of the way gives

  background: #10131a; border-radius: var(--radius);
  padding: clamp(20px, 3.2vw, 46px) clamp(20px, 3.6vw, 56px) clamp(26px, 3.6vw, 52px);

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

.splash-close {

.splash-card.spent h2 { color: var(--muted); }

.splash .splash-card.dropzone h2 { color: var(--muted); }

     it on the right. */
  .brand { margin-left: auto; display: flex; align-items: center; gap: 2mm;
           font-family: 'Chango', var(--mono); font-size: 4.6mm; font-weight: 400; }
  /* Under the sheet rather than in its header: the header is part of what
     gets printed, and a control living inside the thing it acts on has to be
     taken back out again on paper. On screen only, for the same reason. */
  .print-row { display: flex; justify-content: center; margin: 8mm 0 4mm; }
  .print {
    font: inherit; font-size: 3.4mm; cursor: pointer;
    padding: 2.2mm 7mm; border-radius: 1mm;
    background: var(--text); color: var(--bg); border: none;
  }
  @media print { .print-row { display: none; } }
  .brand::before, .brand::after {
    content: ''; height: 0.75em; width: 1.78em; background: var(--text); border-radius: 0.4mm;
  }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin-bottom: 7mm; }
  .tile { padding: 0; }
  .tile h2 { font-size: 3.4mm; margin: 0 0 2.5mm; font-weight: 700; }
  .fig { width: 100%; height: auto; display: block; }
  .fig .ln { fill: none; stroke: var(--text); stroke-width: 1; stroke-linejoin: round; }
  .fig .thin { stroke-width: 0.45; }
  .fig .dash { stroke-dasharray: 2 1.6; stroke-width: 0.4; }
  /* Held for as long as you hold the key, or for as long as the patch goes on
     sounding: a duration the picture cannot show, so it stops drawing it. */
  .fig .hold { stroke-dasharray: 0.1 2.4; stroke-linecap: round; }
  /* Four line styles for four curves. They all meet at the break point and all
     arrive at the same two corners, so shape alone cannot tell them apart. */
  .fig .lin-plus { }
  .fig .exp-plus { stroke-dasharray: 3.2 1.6; }
  .fig .exp-minus { stroke-dasharray: 0.1 2; stroke-linecap: round; stroke-width: 1.1; }
  .fig .lin-minus { stroke-dasharray: 4.5 1.4 0.1 1.4; stroke-linecap: round; }
  .fig text { font-family: inherit; font-size: 4px; fill: var(--text); }
  .fig .sm { font-size: 3.5px; }
  .fig .mid { text-anchor: middle; }
  .fig .end { text-anchor: end; }
  .fig .bold { font-weight: 700; }
  .fig .dot { fill: var(--text); }
  /* The octave scale: present, and quieter than the curves it measures. */
  .fig .grid { fill: none; stroke: var(--text); stroke-width: 0.25; opacity: 0.32; }
  .fig .tick { opacity: 0.6; }

  h2.section { font-size: 3.4mm; margin: 0 0 5mm; font-weight: 700; }
  h2.section span { font-weight: 400; }

  /*
   * The carriers land on a common line across each row.
   *
   * Bottom-aligned rather than centred: every algorithm has its output row at
   * the foot of its own drawing, so aligning the feet puts all four carrier
   * rows of a row on one line and the page gets a horizontal rhythm instead of
   * thirty-two drawings floating at thirty-two heights.
   */
  .algos { display: grid; grid-template-columns: repeat(4, 1fr);
           gap: 4mm 2mm; align-items: end; }
  /*
   * The number beside the drawing rather than over it, and large enough to
   * find without reading. Grey, because it is an index: on a sheet you are
   * scanning for algorithm 22, the numbers want to be the thing you can see
   * from a foot away, and the diagrams want to be the thing you read once you
   * have stopped. Both at full black would compete.
   */
  /* Numbers in a column of their own, so they line up down the page, with the
     drawing centred in what is left - the widths run from one box to six, and
     left-aligning them left every column visibly ragged. */
  /* The number in a gutter of its own, so the numbers line up down the page
     however wide the drawing beside them turns out to be. */
  /*
   * The number sits on the carrier line, not in the middle of the drawing.
   *
   * Centred, it rode up and down with the height of the algorithm beside it -
   * a three-deep one pushed its number twelve pixels higher than the two-deep
   * one next to it, and a row of four read as four different heights even
   * though the drawings themselves were aligned to the pixel. The carriers are
   * the one line every algorithm has, so that is the line to hang everything
   * off. The padding is the drawing's own bottom margin, which is all that
   * sits between the carrier row and the foot of its box.
   */
  .cell { display: grid; grid-template-columns: 9mm 1fr; column-gap: 2mm;
          align-items: end; width: 100%; }
  .cell .n { font-size: 7mm; font-weight: 700; color: var(--text); opacity: 0.55;
             line-height: 0.82; text-align: right; padding-bottom: 0.8mm; }
  .cell svg { justify-self: start; }
  /* Sized in the script, from each drawing's own viewBox: see there. */
  .cell svg { display: block; }
  /*
   * 700, not the component's 600.
   *
   * Only 400 and 700 of Space Mono are loaded, so a request for 600 leaves the
   * browser free to synthesise one by smearing the regular - which at these
   * sizes comes out visibly wobbly, every digit leaning a slightly different
   * way. Asking for a weight that exists on disk gets the real glyphs.
   */
  .cell svg text { font-weight: 700; font-size: 26px; }
  /* Who modulates whom is the content of these pictures, and at print size the
     component's screen weight left the connections thinner than the box
     outlines they join. */
  .cell svg path[stroke="var(--muted)"] { stroke-width: 2.8; }
  /* The feedback loop is the one line that is not a connection between two
     operators - it is an operator wired to itself - so it is drawn as a
     different kind of line rather than the same line in a different place. */
  .cell svg path[stroke="var(--accent-2)"]:not([stroke-linejoin]) { stroke-dasharray: 7 5; }

</style>
